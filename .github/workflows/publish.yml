name: Publish

# Publishes to npm when a GitHub release is published. npm trusts this
# workflow (Trusted Publishing, OIDC), so no npm token is stored anywhere.
on:
  release:
    types: [published]

permissions:
  contents: read
  # For the OIDC token npm exchanges for a short-lived publish token, and for provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})"
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs typecheck, tests and build first.
      - run: npm publish --provenance --access public
